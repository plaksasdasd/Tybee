token: __TOKEN__
brand_name: "Тайби"
unban_fine_rub: shared
texts:
  WELCOME: |-
    <b>{brand}</b> — удобный сервис доставки товаров со всего мира 🌍

    Привозим что угодно из США, Японии, Европы, ЮАР и других стран: одежду, технику, коллекционные вещи и фигурки.
    Без огромных комиссий и с простой доставкой.

    Выберите действие в меню ниже 👇
  PROFILE: |-
    <b>👤 Ваш личный кабинет</b>
    👤 {name}
    🆔 ID: <code>{user_id}</code>
    📦 Заказов: {orders_count}

    Здесь хранятся ваши заказы и документы сервиса 📁
  OFFER: |-
    <b>📄 Публичная оферта</b>

    Сервис «{brand}» оказывает услуги по поиску, выкупу и доставке товаров из-за рубежа 🌍

    1️⃣ Оформляя заказ, вы соглашаетесь с условиями обслуживания.
    2️⃣ Стоимость услуги рассчитывается индивидуально и подтверждается до оплаты.
    3️⃣ Оплата производится по реквизитам, выданным ботом.
    4️⃣ Сроки доставки зависят от наличия товара и логистики.
    5️⃣ Возврат и обмен регулируются законодательством РФ.

    📄 Полный текст оферты: <a href="https://tybee.ru/publicoffer">tybee.ru/publicoffer</a>
  NO_ORDERS: |-
    <b>📦 Мои заказы</b>

    У вас пока нет заказов.
    Начните с раздела «Оформить заказ» в главном меню 🛒
  ORDERS_HEADER: |
    <b>📦 Мои заказы</b>
  ORDER_CHOICE: |-
    <b>🧭 Оформление заказа</b>

    Как оформим заказ?

    🏷 <b>По артикулу</b> — быстро оформим заказ на товар, который есть в нашем каталоге на сайте.

    🎁 <b>Mystery Box</b> — это набор из лимитированных вещей, подобранный командой на основе ваших предпочтений.

    📝 <b>Персональная заявка</b> — мы закажем любой товар, даже если его нет в нашем каталоге.
  MYSTERY_LIST: |-
    🎁 <b>Mystery Box</b>

    Выберите тип бокса — мы сразу выставим счёт 💸
    После оплаты команда соберёт ваш бокс и свяжется с вами ✨
  MYSTERY_EMPTY: |-
    🎁 <b>Mystery Box</b>

    Боксы пока недоступны. Загляните позже или оформите персональную заявку 📝
  MYSTERY_OFFER: |-
    <b>Mystery Box выбран</b> 🎁

    📦 <b>{title}</b>
    💴 Стоимость: <b>{price} ₽</b>

    Переходим к оплате 💳
  ARTICLE_ALREADY: |-
    <b>🏷 Оформление заказа</b>

    У вас уже есть артикул товара с сайта?

    ✅ Найдите необходимый вам товар на нашем сайте и скопируйте его артикул. Вы сможете быстро оформить и оплатить заказ по фиксированной цене.

    ❎ Если вы не нашли необходимый товар на сайте, то создайте персональную заявку на подбор и выкуп любого товара из-за рубежа.
  ARTICLE_PROMPT: |-
    <b>🏷 Введите артикул товара с сайта <a href="https://tybee.ru">tybee.ru</a></b>

    Отправьте 6-значный код товара (например, <code>482915</code>) ✍️
    Мы проверим, есть ли он в нашем каталоге 🔎
  ARTICLE_INVALID: |-
    ⚠️ Это не похоже на артикул.

    Артикул — это <b>6 цифр</b> с сайта. Попробуйте ещё раз, например <code>482915</code>.
  REJECTED_CATALOG: |-
    <b>❎ Вашего товара нет в каталоге</b>

    Артикул <code>{code}</code> не найден в нашей библиотеке.

    Но мы можем найти его вручную 🔎 — оформите персональную заявку, и команда подберёт товар под вас 📝
  FOUND: |-
    <b>Вашу заявку одобрили</b> ✅

    🛍 <b>{title}</b>
    🔖 Артикул: <code>{code}</code>
    💴 Стоимость услуги: <b>{price} ₽</b>
    {description}
    Переходим к оплате 💳
  PAYMENT: |-
    <b>💸 Оплата заказа</b>

    Заказ <b>#{order_id}</b> — <b>{title}</b>
    К оплате: <b>{price} ₽</b>

    Нажмите кнопку ниже, чтобы оплатить через Robokassa. Подтверждение придёт автоматически.
  PAYMENT_UNAVAILABLE: "Оплата через Robokassa временно недоступна. Попробуйте позже."
  APPROVED: |-
    <b>Вашу заявку одобрили</b> ✅

    Оплата по заказу <b>#{order_id}</b> подтверждена.
    Команда уже занимается вашим заказом.

    Нажмите кнопку ниже, чтобы открыть диалог с командой.
  REJECTED_PAYMENT: |-
    <b>Вашу заявку отклонили</b> ❎

    По заказу <b>#{order_id}</b> мы не увидели поступление средств.

    Если вы оплатили — напишите в поддержку, приложив чек, и мы разберёмся 🛟
  ORDER_CREATED: |-
    <b>Вам выставлен счёт</b> 🧾

    🛍 <b>{title}</b>
    {description}💴 К оплате: <b>{price} ₽</b>

    Нажмите кнопку ниже, чтобы оплатить через Robokassa. Подтверждение придёт автоматически.
  SUPPORT: |-
    <b>🛟 Поддержка</b>

    Напишите ваш вопрос — сотрудник ответит вам прямо здесь.
  DIALOG_OPEN: |-
    <b>Диалог с командой открыт</b> 💬

    Пишите сюда любые сообщения — они уйдут команде.
    Чтобы вернуться в меню, нажмите кнопку ниже.
  PERSONAL_PROMPT: |-
    <b>📝 Персональная заявка</b>

    Опишите, что вы хотите заказать: ссылку на товар 🔗, название, размер, цвет и любые детали.

    Команда изучит заявку и свяжется с вами 💬
  PERSONAL_DONE: |-
    <b>Заявка принята</b> ✅

    Заказ <b>#{order_id}</b> создан 🎉
    Открываем диалог с командой — напишите сюда любые уточнения 💬
  BANNED_SCREEN: |-
    🚫 <b>Доступ к боту ограничен</b>

    Ваш аккаунт заблокирован. Чтобы продолжить пользоваться сервисом, оплатите штраф в размере <b>{fine} ₽</b> через Robokassa.

    Нажмите кнопку ниже, чтобы оплатить и снять блокировку.
  UNBANNED: |-
    ✅ <b>Блокировка снята</b>

    Спасибо! Доступ к сервису восстановлен. Нажмите /start, чтобы вернуться в меню.
  OFFER_URL: "https://tybee.ru/publicoffer"
