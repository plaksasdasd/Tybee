  UNBAN_PAYMENT_DESCRIPTION: "Разблокировка аккаунта {brand} #{user_id}"
  ORDER_STATUS_PUSH: "\U0001F4E6 Заказ #{order_id}: новый статус — <b>{title}</b>"
  ORDER_PING: "🔔 Напоминаем о заказе #{order_id} «{title}». Текущий статус: {status}."
