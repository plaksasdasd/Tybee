<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tybee — Панель поддержки</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="root">
    <section id="login-screen" class="screen login-screen hidden" aria-label="Вход">
      <div class="login-card">
        <h1>Tybee</h1>
        <p class="subtitle">Панель поддержки</p>
        <div id="login-widget" class="login-widget" aria-live="polite">
          <div class="loader">Загрузка входа через Telegram…</div>
        </div>
        <p id="login-error" class="error-text" role="alert"></p>
      </div>
    </section>

    <section id="app-screen" class="screen app-screen hidden" aria-label="Приложение">
      <header class="app-header">
        <div class="brand">Tybee</div>
        <div class="header-actions">
          <button id="operators-btn" class="btn btn-ghost hidden" type="button">Операторы</button>
          <span id="user-name" class="user-name"></span>
          <button id="logout-btn" class="btn btn-danger" type="button">Выйти</button>
        </div>
      </header>

      <div class="app-layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <label class="sr-only" for="client-search">Поиск клиентов</label>
            <input id="client-search" class="search-input" type="search" placeholder="Поиск по имени или @username…" autocomplete="off">
          </div>
          <div id="client-list" class="client-list" role="list" aria-label="Клиенты"></div>
          <button id="load-more-clients" class="btn btn-ghost load-more hidden" type="button">Загрузить ещё</button>
          <p id="client-list-error" class="error-text" role="alert"></p>
        </aside>

        <main class="content">
          <div id="client-placeholder" class="placeholder">
            <p>Выберите клиента, чтобы начать переписку</p>
          </div>

          <div id="client-detail" class="client-detail hidden">
            <div class="detail-header">
              <div class="client-info">
                <h2 id="detail-name"></h2>
                <span id="detail-username" class="username"></span>
                <span id="detail-source" class="badge"></span>
                <span id="detail-status" class="status"></span>
              </div>
              <button id="ban-btn" class="btn" type="button"></button>
            </div>

            <div class="detail-body">
              <div class="history-column">
                <div id="message-history" class="message-history" role="log" aria-live="polite" aria-relevant="additions"></div>
                <form id="composer-form" class="composer">
                  <label class="sr-only" for="composer-input">Сообщение</label>
                  <textarea id="composer-input" class="composer-input" rows="2" placeholder="Напишите ответ…" required></textarea>
                  <button id="send-btn" class="btn btn-primary" type="submit">Отправить</button>
                </form>
                <p id="composer-error" class="error-text" role="alert"></p>
              </div>

              <div class="orders-column">
                <div class="orders-header">
                  <h3>Заказы и счета</h3>
                  <button id="create-invoice-btn" class="btn btn-primary" type="button">Создать счет</button>
                </div>
                <div id="orders-list" class="orders-list"></div>
                <p id="orders-error" class="error-text" role="alert"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </section>

    <div id="invoice-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="invoice-title">
      <div class="modal-backdrop" data-close="invoice-modal"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="invoice-title">Новый счет</h2>
          <button class="btn btn-ghost modal-close" type="button" data-close="invoice-modal" aria-label="Закрыть">×</button>
        </div>
        <form id="invoice-form" class="modal-body">
          <label class="field">
            <span class="field-label">Название</span>
            <input id="inv-title" type="text" required maxlength="200">
          </label>
          <label class="field">
            <span class="field-label">Описание</span>
            <textarea id="inv-description" rows="3" maxlength="2000"></textarea>
          </label>
          <label class="field">
            <span class="field-label">Сумма, ₽</span>
            <input id="inv-price" type="number" min="1" step="1" required>
          </label>
          <p id="invoice-error" class="error-text" role="alert"></p>
          <div class="modal-actions">
            <button class="btn btn-ghost" type="button" data-close="invoice-modal">Отмена</button>
            <button id="invoice-submit" class="btn btn-primary" type="submit">Выставить счет</button>
          </div>
        </form>
      </div>
    </div>

    <div id="operators-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="operators-title">
      <div class="modal-backdrop" data-close="operators-modal"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="operators-title">Операторы</h2>
          <button class="btn btn-ghost modal-close" type="button" data-close="operators-modal" aria-label="Закрыть">×</button>
        </div>
        <div class="modal-body">
          <form id="operator-form" class="operator-form">
            <label class="field">
              <span class="field-label">Telegram ID</span>
              <input id="op-id" type="number" min="1" step="1" required>
            </label>
            <label class="field">
              <span class="field-label">Отображаемое имя</span>
              <input id="op-name" type="text" required maxlength="100">
            </label>
            <button class="btn btn-primary" type="submit">Добавить</button>
          </form>
          <p id="operators-error" class="error-text" role="alert"></p>
          <div id="operators-list" class="operators-list"></div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
