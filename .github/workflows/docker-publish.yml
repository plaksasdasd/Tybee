name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}-latest
            type=sha,format=short

      - name: Extract site image metadata
        id: meta-site
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-site
          tags: |
            type=raw,value=${{ github.ref_name }}-latest
            type=sha,format=short

      - name: Build and push bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push site image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          tags: ${{ steps.meta-site.outputs.tags }}
          labels: ${{ steps.meta-site.outputs.labels }}