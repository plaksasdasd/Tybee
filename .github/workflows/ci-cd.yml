name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_hours:
        description: How long to keep the bot running
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements-lock.txt
      - name: Validate Python sources
        run: python -m compileall app scripts support_bot
      - name: Build container image
        run: docker build -t tybee-bot .

  manual-run:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taibi
          POSTGRES_USER: taibi
          POSTGRES_PASSWORD: taibi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taibi -d taibi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements-lock.txt
      - name: Run bot for the test window
        env:
          TYBEE_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TYBEE_ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: taibi
          POSTGRES_USER: taibi
          POSTGRES_PASSWORD: taibi
          RUN_HOURS: ${{ inputs.run_hours }}
        run: |
          hours="$RUN_HOURS"
          if [ -z "$hours" ]; then
            hours="6"
          fi
          timeout "${hours}h" python -m app
