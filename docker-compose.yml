services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taibi}
      POSTGRES_USER: ${POSTGRES_USER:-taibi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-taibi} -d ${POSTGRES_DB:-taibi} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      COVERS_ROOT: /app/covers
      DATA_DIR: /app/data
    volumes:
      - ./covers:/app/covers
      - ./data:/app/data
    ports:
      - "127.0.0.1:${AVITO_WEBHOOK_PORT:-8080}:${AVITO_WEBHOOK_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      COVERS_ROOT: /app/covers
      DATA_DIR: /app/data
    volumes:
      - ./covers:/app/covers
      - ./data:/app/data
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
